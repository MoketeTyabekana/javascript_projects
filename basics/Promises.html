<script>
    const myPromise = new Promise((resolve,reject)=>{

        let success=false;

        if(success){
            resolve("The operation was successful!");
        }else{
            reject("The operation failed.");
        }
    });

    myPromise.then((message)=>{
        console.log(message);
    }).catch((error)=>{
        console.log(error);
    });
</script>
