<script>
    //For Loop Example
    for (let i=1; i<=5; i++){
        console.log("Iteration number: "+i);
    }

    //While Loop Example
    let count=1;
    while (count<=5){
        console.log("Count is: "+count);
        count++;
    }

    for(let a=1;a<=20;a++){
      console.log("Num is", a);
    }

    let number=1;
    let sum=0;
    while(number<=10){
      sum+=number;  
      number++;
    }

    console.log("Sum is", sum);
</script>
